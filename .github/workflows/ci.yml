name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Core não pode referenciar UnityEngine
        run: |
          if grep -rnE '^\s*using\s+UnityEngine|Include="UnityEngine' core/ --include="*.cs" --include="*.csproj"; then
            echo "::error::core/ referencia UnityEngine"
            exit 1
          fi

      - name: Build do core fora do Unity
        run: dotnet build core -c Release --nologo

      - name: Testes
        run: dotnet test core.tests -c Release --nologo

      - name: Build do servidor
        run: dotnet build server -c Release --nologo

      - name: Testes do servidor (4 clientes WebSocket, reconexão, mão oculta)
        run: dotnet test server.tests -c Release --nologo

      - name: Simulação de fumaça (200 partidas IA×IA)
        run: dotnet run -c Release --project simulator -- 200 || test $? -eq 2
